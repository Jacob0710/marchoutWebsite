name: Phase 10 quality gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run phase10:decisions
      - run: git diff --exit-code -- migration/phase10/editorial-decisions.json migration/phase10/redirect-decisions.json
      - run: pnpm run test:phase10
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: git diff --check

  production-synthetic:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Hourly production health and public-route contract
        env:
          PHASE10_SYNTHETIC_ORIGIN: https://marchout-website.vercel.app
        run: node scripts/phase10/synthetic-check.mjs

  protected-release-gate:
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Protected Phase 10 smoke
        env:
          PHASE10_BASE_URL: ${{ vars.PHASE10_BASE_URL }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ vars.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_ANON_KEY }}
          PHASE10_ADMIN_EMAIL: ${{ secrets.PHASE10_ADMIN_EMAIL }}
          PHASE10_ADMIN_PASSWORD: ${{ secrets.PHASE10_ADMIN_PASSWORD }}
          PHASE10_INACTIVE_ADMIN_EMAIL: ${{ secrets.PHASE10_INACTIVE_ADMIN_EMAIL }}
          PHASE10_INACTIVE_ADMIN_PASSWORD: ${{ secrets.PHASE10_INACTIVE_ADMIN_PASSWORD }}
        run: pnpm run test:phase10:smoke
      - name: External-origin synthetic contract
        env:
          PHASE10_SYNTHETIC_ORIGIN: ${{ vars.PHASE10_BASE_URL }}
        run: pnpm run phase10:synthetic
