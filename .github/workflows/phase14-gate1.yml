name: Phase 14 Gate 1 repository readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase14-gate1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase14-gate1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run phase11:verify
      - run: pnpm run phase12:verify
      - run: pnpm run phase14:test
      - run: pnpm run phase14:verify
      - run: pnpm run phase13:verify
      - run: pnpm run phase13:test
      - run: pnpm run lint
      - run: pnpm run phase11:audit
      - run: pnpm run test:coverage
      - run: pnpm run test:application
      - run: pnpm run test:phase10
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e:chromium
      - run: pnpm run phase12:scan-artifacts
      - run: git diff --check
      - name: Upload sanitized quality evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase14-gate1-${{ github.sha }}
          path: |
            coverage/
            coverage-application/
            playwright-report/
            test-results/results.json
          if-no-files-found: error
          retention-days: 7

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
