name: Production synthetic health and public-route contract

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-synthetic
  cancel-in-progress: true

jobs:
  production-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Hourly production health and public-route contract
        env:
          PHASE10_SYNTHETIC_ORIGIN: https://marchout-website.vercel.app
        run: node scripts/phase10/synthetic-check.mjs
