name: Phase 11 quality and security gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase11-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run phase11:verify
      - run: pnpm run phase10:decisions
      - run: git diff --exit-code -- migration/phase10/editorial-decisions.json migration/phase10/redirect-decisions.json
      - run: pnpm run lint
      - run: pnpm run phase11:audit
      - run: pnpm run test:coverage
      - run: pnpm run test:phase10
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test:integration
      - run: git diff --check
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase11-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  production-synthetic:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Hourly production health and public-route contract
        env:
          PHASE10_SYNTHETIC_ORIGIN: https://marchout-website.vercel.app
        run: node scripts/phase10/synthetic-check.mjs
