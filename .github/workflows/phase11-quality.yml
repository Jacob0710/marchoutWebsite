name: Phase 11 quality and security gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      phase12_release_sha:
        description: Optional exact Phase 12 Draft PR head to validate in isolated staging
        required: false
        type: string
      phase12_pull_request:
        description: Draft Phase 12 pull request number
        required: false
        type: string
      phase12_approval_issue:
        description: Owner approval issue for a protected-main Phase 12 staging run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: phase11-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run phase11:verify
      - run: pnpm run phase10:decisions
      - run: git diff --exit-code -- migration/phase10/editorial-decisions.json migration/phase10/redirect-decisions.json
      - run: pnpm run lint
      - run: pnpm run phase11:audit
      - run: pnpm run test:coverage
      - run: pnpm run test:phase10
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test:integration
      - run: git diff --check
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase11-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review pull request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Review final-main dependency changes
        if: github.event_name == 'push'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ github.event.before }}
          head-ref: ${{ github.sha }}

  phase12-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.phase12_release_sha != ''
    needs: quality
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    uses: ./.github/workflows/phase12-staging-e2e.yml
    with:
      release_sha: ${{ inputs.phase12_release_sha }}
      pull_request: ${{ inputs.phase12_pull_request }}
      approval_issue: ${{ inputs.phase12_approval_issue }}
    secrets: inherit
