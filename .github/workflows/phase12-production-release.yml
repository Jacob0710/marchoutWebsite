name: Phase 12 production release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact protected main commit to release
        required: true
        type: string
      staging_run_id:
        description: Successful Phase 12 staging workflow run ID
        required: true
        type: string
      approval_issue:
        description: Issue containing owner approval for this exact commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase12-production-release
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 58.3.0
  PHASE12_RELEASE_SHA: ${{ inputs.release_sha }}
  PHASE12_STAGING_RUN_ID: ${{ inputs.staging_run_id }}
  PHASE12_APPROVAL_ISSUE: ${{ inputs.approval_issue }}

jobs:
  verify-release:
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PHASE12_RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Require the current protected main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$PHASE12_RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$PHASE12_RELEASE_SHA"
      - name: Verify staging run, required checks, and owner approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PHASE12_REQUIRED_CHECKS: quality,phase12-quality,Vercel
        run: pnpm run phase12:verify-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phase12-staging-result-${{ env.PHASE12_RELEASE_SHA }}
          path: staging-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PHASE12_STAGING_RUN_ID }}
      - name: Verify cleanup and zero production mutation evidence
        shell: bash
        run: |
          set -euo pipefail
          node -e "const j=require('./staging-evidence/phase12-staging-result.json');if(j.releaseSha!==process.env.PHASE12_RELEASE_SHA||j.remainingFixtureCount!==0||j.productionMutations!==0)throw new Error('Staging promotion evidence mismatch')"

  deploy-production:
    needs: verify-release
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.PHASE12_PRODUCTION_VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.PHASE12_PRODUCTION_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.PHASE12_PRODUCTION_VERCEL_PROJECT_ID }}
      PHASE12_PRODUCTION_BASE_URL: ${{ vars.PHASE12_PRODUCTION_BASE_URL }}
      NUXT_PUBLIC_SUPABASE_URL: ${{ vars.PHASE12_PRODUCTION_SUPABASE_URL }}
      NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PHASE12_PRODUCTION_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PHASE12_RELEASE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Deploy the approved commit to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$PHASE12_PRODUCTION_BASE_URL"
          test -n "$NUXT_PUBLIC_SUPABASE_URL"
          test -n "$NUXT_PUBLIC_SUPABASE_ANON_KEY"
          pnpm dlx "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production --token="$VERCEL_TOKEN"
          NUXT_PHASE10_ENVIRONMENT=production \
          NUXT_PHASE10_HSTS_ENABLED=true \
          NUXT_PHASE12_RELEASE_SHA="$PHASE12_RELEASE_SHA" \
          NUXT_PUBLIC_SITE_URL="$PHASE12_PRODUCTION_BASE_URL" \
          pnpm dlx "vercel@$VERCEL_CLI_VERSION" build --prod --token="$VERCEL_TOKEN"
          deployment_url="$(pnpm dlx "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
            --env "NUXT_PHASE10_ENVIRONMENT=production" \
            --env "NUXT_PHASE10_HSTS_ENABLED=true" \
            --env "NUXT_PHASE12_RELEASE_SHA=$PHASE12_RELEASE_SHA" \
            --env "NUXT_PUBLIC_SITE_URL=$PHASE12_PRODUCTION_BASE_URL" \
            --env "NUXT_PUBLIC_SUPABASE_URL=$NUXT_PUBLIC_SUPABASE_URL" \
            --env "NUXT_PUBLIC_SUPABASE_ANON_KEY=$NUXT_PUBLIC_SUPABASE_ANON_KEY")"
          printf 'url=%s\n' "$PHASE12_PRODUCTION_BASE_URL" >> "$GITHUB_OUTPUT"

  production-smoke:
    needs: deploy-production
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PHASE12_PRODUCTION_BASE_URL: ${{ vars.PHASE12_PRODUCTION_BASE_URL }}
      PHASE12_PRODUCTION_READONLY_EMAIL: ${{ secrets.PHASE12_PRODUCTION_READONLY_EMAIL }}
      PHASE12_PRODUCTION_READONLY_PASSWORD: ${{ secrets.PHASE12_PRODUCTION_READONLY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PHASE12_RELEASE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run phase12:production-smoke
      - run: pnpm run phase12:production-auth-smoke
      - name: Record zero-mutation production evidence
        shell: bash
        run: |
          set -euo pipefail
          node -e "require('fs').writeFileSync('phase12-production-result.json',JSON.stringify({releaseSha:process.env.PHASE12_RELEASE_SHA,credentialFreeSmoke:'passed',authenticatedReadOnlySmoke:'passed',productionMutations:0},null,2)+'\n')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase12-production-result-${{ env.PHASE12_RELEASE_SHA }}
          path: phase12-production-result.json
          if-no-files-found: error
          retention-days: 30
